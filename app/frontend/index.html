<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech AI Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f4f4;
        }

        .container {
            width: 500px;
            max-width: 90%;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .status {
            margin: 20px 0;

            padding: 12px;

            border-radius: 10px;

            background: #f1f1f1;
        }

        .record-btn {
            width: 160px;
            height: 160px;

            border-radius: 50%;

            border: none;

            background: #222;
            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .record-btn.recording {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .record-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section {
            margin-top: 25px;

            padding: 15px;

            border-radius: 12px;

            background: #f8f8f8;

            text-align: left;
        }

        .label {
            font-weight: bold;

            margin-bottom: 8px;
        }

        audio {
            width: 100%;

            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🎙️ Speech AI Assistant</h1>

    <p>Talk naturally with the assistant</p>

    <div
        id="status"
        class="status"
    >
        Ready
    </div>

    <button
        id="recordButton"
        class="record-btn"
    >
        🎤<br>
        Record
    </button>

    <div class="section">

        <div class="label">
            You said:
        </div>

        <div id="transcript">
            —
        </div>

    </div>

    <div class="section">

        <div class="label">
            Assistant:
        </div>

        <div id="response">
            —
        </div>

        <audio
            id="audioPlayer"
            controls
        ></audio>

    </div>

</div>


<script>

const recordButton =
    document.getElementById("recordButton");

const statusElement =
    document.getElementById("status");

const transcriptElement =
    document.getElementById("transcript");

const responseElement =
    document.getElementById("response");

const audioPlayer =
    document.getElementById("audioPlayer");


let mediaRecorder;

let audioChunks = [];

let isRecording = false;

const sessionId =
    crypto.randomUUID();


async function startRecording() {

    const stream =
        await navigator.mediaDevices.getUserMedia({
            audio: true
        });

    mediaRecorder =
        new MediaRecorder(stream);

    audioChunks = [];

    mediaRecorder.ondataavailable =
        event => {

            if (event.data.size > 0) {

                audioChunks.push(
                    event.data
                );

            }

        };

    mediaRecorder.onstop =
        async () => {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            const audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type: mediaRecorder.mimeType
                    }
                );

            await sendAudio(
                audioBlob
            );

        };

    mediaRecorder.start();

    isRecording = true;

    recordButton.classList.add(
        "recording"
    );

    recordButton.innerHTML =
        "⏹️<br>Stop";

    statusElement.textContent =
        "Listening...";

}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }

    isRecording = false;

    recordButton.classList.remove(
        "recording"
    );

    recordButton.innerHTML =
        "🎤<br>Record";

}


async function sendAudio(audioBlob) {

    try {

        statusElement.textContent =
            "Processing...";

        recordButton.disabled =
            true;

        const formData =
            new FormData();

        formData.append(
            "audio",
            audioBlob,
            "record.webm"
        );

        const response =
            await fetch(
                `/chat?session_id=${sessionId}`,
                {
                    method: "POST",
                    body: formData
                }
            );

        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }

        const result =
            await response.json();

        transcriptElement.textContent =
            result.transcript;

        responseElement.textContent =
            result.response;

        const filename =
            result.audio_path
                .split(/[\\/]/)
                .pop();

        audioPlayer.src =
            `/audio/${filename}`;

        audioPlayer.load();

        statusElement.textContent =
            "Assistant is speaking...";

        await audioPlayer.play();

        audioPlayer.onended =
            () => {

                statusElement.textContent =
                    "Ready — record again";

            };

    } catch (error) {

        console.error(error);

        statusElement.textContent =
            "Something went wrong";

    } finally {

        recordButton.disabled =
            false;

    }

}


recordButton.addEventListener(
    "click",
    async () => {

        if (!isRecording) {

            await startRecording();

        } else {

            stopRecording();

        }

    }
);

</script>

</body>

</html>
